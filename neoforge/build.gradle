plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
java { toolchain.languageVersion=JavaLanguageVersion.of(21) }
neoForge {
 version='21.11.48'
 runs { client { client() }; server { server(); programArgument '--nogui' } }
 mods { rustify { sourceSet sourceSets.main } }
}

version='0.1.0'
group='dev.rustify'
sourceSets.main.java.srcDir '../java-common/src/main/java'
sourceSets.main.resources.srcDir '../java-common/src/main/resources'
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
