plugins { id 'net.fabricmc.fabric-loom' version '1.19.3' }
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:26.3'
 modImplementation 'net.fabricmc:fabric-loader:0.20.1'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.165.0+26.3'
}
java { toolchain.languageVersion=JavaLanguageVersion.of(25) }

version='0.1.0'
group='dev.rustify'
sourceSets.main.java.srcDir '../java-common/src/main/java'
sourceSets.main.resources.srcDir '../java-common/src/main/resources'
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
